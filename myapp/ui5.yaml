specVersion: "2.3"
metadata:
  name: myApp
type: application
resources:
  configuration:
    paths:
      webapp: webapp
builder:
  resources:
    excludes:
      - "test/**"
  settings:
    includeDependencies: true
server:
  customMiddleware:
    - name: ui5-middleware-simpleproxy
      mountPath: /resources
      afterMiddleware: compression
      configuration:
        baseUri: "https://ui5.sap.com/1.133.0/resources"
